name: "기능 제안 / Feature request"
description: "K4RMA 개선 제안 (제안이 곧 승인인 것은 아닙니다) / Propose a change."
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: "해결하려는 문제 / Player or development problem"
      description: "새 기능 목록보다 실제 문제를 설명하세요. / Describe the actual problem first."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "제안 / Proposed approach"
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: "효과·범위·위험 / Expected outcome, scope and risks"
      description: "진행·전투·UI·에셋 및 기존 기능 영향 / Impacts on progression, combat, UI, assets and existing behavior"
  - type: textarea
    id: validation
    attributes:
      label: "완료 기준 / Acceptance criteria"
