name: "버그 신고 / Bug report"
description: "게임 동작 또는 Unity 관련 문제를 신고합니다. / Report a gameplay or Unity issue."
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "보안 취약점과 비밀정보는 공개하지 마세요. / Do not disclose security vulnerabilities or secrets publicly. [SECURITY](https://github.com/azizbekdevuz/K4RMA/blob/main/SECURITY.md)"
  - type: textarea
    id: summary
    attributes:
      label: "문제 / Problem"
      description: "예상 동작과 실제 동작 / Expected and actual behavior"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "재현 방법 / Steps to reproduce"
      placeholder: "1. ...
2. ...
3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "버전·브랜치·커밋 / Version, branch or commit"
      placeholder: "Unity 6000.6.2f1 · main · SHA"
  - type: dropdown
    id: platform
    attributes:
      label: "플랫폼 / Platform"
      options:
        - "Unity Editor"
        - "Windows build"
        - "Other / 기타"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "로그·스크린샷 / Logs or screenshots"
      description: "개인정보, 키, 구매 정보는 제거 / Redact personal data, tokens and purchase details"
